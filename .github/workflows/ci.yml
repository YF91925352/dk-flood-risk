name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: flood
          POSTGRES_PASSWORD: flood
          POSTGRES_DB: flood
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flood -d flood" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://flood:flood@localhost:5432/flood
      REQUIRE_DB: "1"   # integration tests must run here, never be skipped
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build   # includes the TypeScript type check

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the whole stack
        run: docker compose up -d --build --wait
      - name: Health check through the web container (nginx -> api -> PostGIS)
        run: curl --fail --silent http://localhost:8080/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs
