server {
    listen 80;
    root /usr/share/nginx/html;

    # Same origin for UI and API: no CORS configuration needed.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header X-Request-ID $request_id;
        # A 100-row upload can take ~100 s with a cold geocoding cache (1 lookup per second).
        proxy_read_timeout 300s;
        client_max_body_size 2m;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
