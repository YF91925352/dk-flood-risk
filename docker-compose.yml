services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: flood
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flood}
      POSTGRES_DB: flood
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flood -d flood"]
      interval: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"   # only reachable from this machine

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://flood:${POSTGRES_PASSWORD:-flood}@db:5432/flood
      GEOCODER: ${GEOCODER:-nominatim}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      LOG_LEVEL: INFO
    volumes:
      - ./data:/data:ro           # flood-zone files for `app.admin load-zones`
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

  # Throwaway database for the integration tests (they truncate tables), started only with
  # `docker compose --profile test up -d testdb`. Data lives in memory and disappears on stop.
  testdb:
    image: postgis/postgis:16-3.4
    profiles: ["test"]
    environment:
      POSTGRES_USER: flood
      POSTGRES_PASSWORD: flood
      POSTGRES_DB: flood
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

volumes:
  pgdata:
